<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>Earth Information Jukebox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Full-screen globe. Everything else floats above it. -->
    <div
      id="globe"
      class="globe"
      tabindex="0"
      role="application"
      aria-roledescription="globe"
      aria-label="Earth globe. Left and right arrows spin, up and down tilt, plus and minus zoom. The center marker plays what is under it. Hold Shift to hear the value."
    >
      <div class="reticle" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </div>

    <!-- Browsers block audio until a click, so everything starts here. -->
    <div id="start" class="start">
      <div class="start-card">
        <p class="eyebrow">NASA Space Apps 2026</p>
        <h1>Earth Information Jukebox</h1>
        <p class="lede">Spin the planet and hear NASA Earth data. Ocean temperatures, storms and air, turned into music.</p>
        <button id="start-btn" class="btn-primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
          Start listening
        </button>
        <p class="hint">Headphones recommended · Arrow keys spin · Shift reads values aloud</p>
      </div>
    </div>

    <div id="app" class="app" hidden>
      <!-- Top bar: brand + dataset switcher -->
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M5 16h4l2.5-5 4 10 3-7 2 2H27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div>
            <div class="brand-name">Earth Information Jukebox</div>
            <div class="brand-sub">NASA Earth data you can hear</div>
          </div>
        </div>
        <nav id="shelf" class="segmented glass" aria-label="Datasets"></nav>
      </header>

      <!-- Live readout -->
      <aside id="readout" class="readout glass" aria-hidden="true">
        <div class="readout-head">
          <span id="readout-source" class="chip">Center</span>
          <span id="readout-date" class="readout-date">—</span>
        </div>
        <div id="readout-value" class="readout-value">—</div>
        <div id="readout-place" class="readout-place">—</div>
      </aside>

      <!-- Map tools -->
      <div class="tools glass" role="group" aria-label="Globe controls">
        <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in" title="Zoom in (+)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out" title="Zoom out (−)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <div class="tools-sep" aria-hidden="true"></div>
        <button id="spin-left" class="icon-btn" type="button" aria-label="Spin west" title="Spin west (←)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <button id="spin-right" class="icon-btn" type="button" aria-label="Spin east" title="Spin east (→)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>

      <!-- Status pill for detail view -->
      <div id="detail-badge" class="status-pill glass" hidden aria-hidden="true"></div>

      <!-- Bottom: legend + credit, then the player -->
      <footer class="bottom">
        <div class="meta">
          <div id="legend" class="legend glass" hidden aria-hidden="true">
            <div id="legend-label" class="legend-label"></div>
            <div id="legend-bar" class="legend-bar"></div>
            <div class="legend-scale"><span id="legend-min"></span><span id="legend-max"></span></div>
          </div>
          <div id="credit" class="credit"></div>
        </div>

        <div class="player glass" role="group" aria-label="Playback">
          <button id="play" class="icon-btn play-btn" type="button" aria-label="Pause" aria-pressed="true">
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l11-6.5z" /></svg>
          </button>
          <div class="timeline">
            <!-- Follows the playhead; aria-hidden because the readout + live region announce dates. -->
            <div id="date-tracker" class="date-tracker" aria-hidden="true"></div>
            <label class="sr-only" for="scrub">Position in time</label>
            <input id="scrub" type="range" min="0" max="1000" value="0" />
            <div class="timeline-labels"><span id="time-start"></span><span id="time-end"></span></div>
          </div>
          <label class="speed">
            <span class="sr-only">Playback speed</span>
            <select id="speed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <button id="mute" class="icon-btn" type="button" aria-label="Mute" aria-pressed="false" title="Mute">
            <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
            <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z" /><path d="M17 9l5 6M22 9l-5 6" /></svg>
          </button>
        </div>
      </footer>
    </div>

    <!-- One polite announcement at a time, throttled in a11y.js -->
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
